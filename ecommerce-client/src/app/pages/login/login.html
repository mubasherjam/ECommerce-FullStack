<div class="login-container">

  <div class="login-card">

    <h1>Welcome Back</h1>

    <p>Login to your account</p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="loginRequest.email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="loginRequest.password"
          placeholder="Enter your password"
          required
        />

      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="success-message">
          {{ successMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="isLoading">

        @if (isLoading) {
          Logging in...
        } @else {
          Login
        }

      </button>

    </form>

  </div>

</div>
