<nav class="navbar">

  <a routerLink="/" class="logo">Shopfront</a>

  <div class="nav-links">

    <a routerLink="/" class="nav-link">
      Home
    </a>

    <a routerLink="/products" class="nav-link">
      Products
    </a>

    <a routerLink="/cart" class="nav-link nav-link-cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="21" r="1.4"/>
        <circle cx="17" cy="21" r="1.4"/>
      </svg>
      Cart
    </a>

    @if (isLoggedIn()) {

      <a routerLink="/orders" class="nav-link">
        Orders
      </a>
      @if (isAdmin()) {
        <a routerLink="/admin/products" class="nav-link">
          Manage Products
        </a>
      }
      <button (click)="logout()" class="nav-btn nav-btn-outline">
        Logout
      </button>

    } @else {

      <a routerLink="/login" class="nav-link">
        Login
      </a>

      <a routerLink="/register" class="nav-btn nav-btn-primary">
        Register
      </a>

    }

  </div>

</nav>
